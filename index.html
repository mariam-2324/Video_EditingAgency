<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>video-editing-website</title>
  </head>
  <body>

    <!-- ===============NAVBAR SECTION=============================== -->

    <nav class="navbar navbar-expand-lg bg-body-tertiary fixed-top">
  <div class="container-fluid px-3">
    <i class="bi bi-camera-video-fill nav-logo icon-bounce"></i>
    <!-- <a class="navbar-brand" href="#home">Navbar</a> -->

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
            data-bs-target="#mainNav" aria-controls="mainNav"
            aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0" id="navLinks"></ul>
          </ul>
        </li>
      </ul>

      <form class="search d-flex" role="search">
        <input class="form-control me-2 searchInput " type="search" placeholder="Search" aria-label="Search">
        <button class="btn btn-outline-primary btn-search glow-btn" type="submit">Search</button>
      </form>
    </div>
  </div>
</nav>

<!-- ========== HERO SECTION ================================= -->
<div class="card text-bg-dark video-card" id="videoCard">
  
  </div>
</div>

<!-- =================================== GRID SYSTEM =========================================== -->

<section id="services" class="py-5 gridSystem" id="serviceGrid">
  <div class="container">
    <h2 class="text-center section-title glow-btn">Our Services</h2>
    <div class="row g-4" id="servicesRow"></div>
     </div>
</section>

<!-- ----------------------- FORM SECTION ------------------------ -->

<section id="contact" class="py-5 contact-section">
  <div class="container">
    <h2 class="text-center  text-primary contact-title">Contact Us</h2>

    <div class="contact-card mx-auto">
      <form id="contactForm">
        <input type="text" id="name" class="form-control" placeholder="Name" required>
        <input type="email" id="email" class="form-control" placeholder="Email" required>
        <input type="tel" id="phone" class="form-control" placeholder="Phone">
        <textarea id="message" class="form-control" placeholder="Message" rows="5" required></textarea>

        <button type="submit" class="btn btn-send glow-btn">
          <span>Send via WhatsApp</span>
          <i class="bi bi-send-fill plane-icon"></i>
        </button>
      </form>
    </div>
  </div>
</section>


    <script type="module" src="/src/main.js"></script>
  </body>
</html>
